# Repository Manifest — ATC-AAS-025 §1 · Rollout-Vorreiter (Self-Compliance, F-016)
standard: ATC-AAS-025
repository: atc-standards
agents:
  allowed:                      # 1-Agent-per-Repo (AI-DEV-012 §1, AGENT_PROTOCOL)
    - ATC-AI-ARCH-001            # Aurora #1 (Superagent) — Governance-Registry
required_standards:
  - ATC-STD-000
  - ATC-AAS-001
  - ATC-AAS-003
  - ATC-AAS-007
  - ATC-AAS-008
  - ATC-AAS-011
workflow:
  require_tests: true            # validate_all.py + Mutationssuite + Repo-Audit (CI)
  require_audit: true            # AUD-Record je Agenten-Task (AI-DEV-009)
  require_pr: true               # Ausnahme: Owner-Direktpush dokumentiert (SCR-0003 Option B)
  require_human_merge: true
classification: SPEC             # registry/repositories.yaml
canonical: true                  # kanonische Ablage aller ATC-Standards (SSOT)
