name: SDK Build and Test
on:
  push:
  pull_request:
jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo check --manifest-path sdk/Cargo.toml
      - name: Test
        run: cargo test --manifest-path sdk/Cargo.toml
