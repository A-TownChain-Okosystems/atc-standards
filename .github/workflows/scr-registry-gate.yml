name: SCR Registry Gate
on:
  pull_request:
    branches: [main]
    paths: ['registry/scr-registry.yaml','schemas/scr-registry.schema.json','tools/scr-registry-validator/**','change-requests/**','.github/workflows/scr-registry-gate.yml']
  push:
    branches: [main]
    paths: ['registry/scr-registry.yaml','schemas/scr-registry.schema.json','tools/scr-registry-validator/**','change-requests/**','.github/workflows/scr-registry-gate.yml']
permissions:
  contents: read
jobs:
  scr-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate SCR registry and repository coverage
        run: python tools/scr-registry-validator/validate_scr_registry.py
      - name: Run positive and negative tests
        run: python -m unittest discover -s tools/scr-registry-validator/tests -v
