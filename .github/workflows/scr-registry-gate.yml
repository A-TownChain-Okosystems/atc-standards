name: SCR Registry Gate
on:
  pull_request:
    branches: [main]
    paths: ['registry/scr-registry.yaml','schemas/scr-registry.schema.json','tools/scr-registry-validator/**','change-requests/**','evidence/scr-reconciliation/**','.github/workflows/scr-registry-gate.yml']
  push:
    branches: [main]
    paths: ['registry/scr-registry.yaml','schemas/scr-registry.schema.json','tools/scr-registry-validator/**','change-requests/**','evidence/scr-reconciliation/**','.github/workflows/scr-registry-gate.yml']
permissions:
  contents: read
jobs:
  scr-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate SCR registry and repository coverage
        run: python tools/scr-registry-validator/validate_scr_registry.py
      - name: Verify external historical source commit trees and blobs
        run: |
          python tools/scr-registry-validator/verify_external_sources.py \
            --output scr-registry-evidence/external-source-verification.json
      - name: Run positive and negative tests
        run: python -m unittest discover -s tools/scr-registry-validator/tests -v

      - name: Capture SCR validation evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p scr-registry-evidence
          python tools/scr-registry-validator/validate_scr_registry.py > scr-registry-evidence/validator.log 2>&1
          validator_status=$?
          python tools/scr-registry-validator/verify_external_sources.py --output scr-registry-evidence/external-source-verification.json > scr-registry-evidence/external-source-verification.log 2>&1
          external_status=$?
          python -m unittest discover -s tools/scr-registry-validator/tests -v > scr-registry-evidence/tests.log 2>&1
          tests_status=$?
          set -e
          {
            printf 'pr_head_sha=%s\n' "${{ github.event.pull_request.head.sha || github.sha }}"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'validator_exit=%s\n' "$validator_status"
            printf 'external_verifier_exit=%s\n' "$external_status"
            printf 'tests_exit=%s\n' "$tests_status"
          } > scr-registry-evidence/summary.txt
          find scr-registry-evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > scr-registry-evidence/SHA256SUMS
      - name: Upload SCR validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scr-registry-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: scr-registry-evidence/
          if-no-files-found: error
          retention-days: 90
