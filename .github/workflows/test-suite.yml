name: ATC Test Suite (Tools-Smoke)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tools-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Registry-Check (SCR-0080)
        run: |
          pip install pyyaml -q
          python3 tools/repo_registry_check.py
      - name: Registry-Konsistenz (Validator-Teil, SCR-0082)
        run: |
          python3 - <<'PY'
          import yaml
          w = yaml.safe_load(open("registry/standards.yaml", encoding="utf-8"))
          n = len(w.get("standards", []))
          assert n == 444, f"Registry-Anzahl {n} != 444 (gen_views-SSOT)"
          print(f"Registry OK: {n} Standards")
          PY
      - name: Evidence-Bindung (SCR-0081, bound_commit + test_run)
        if: success()
        run: |
          python3 - <<'PY'
          import os, datetime
          sha = os.environ["GITHUB_SHA"]
          rid = os.environ["GITHUB_RUN_ID"]
          p = ".atc/evidence/evidence.yaml"
          t = open(p, encoding="utf-8").read()
          t = t.replace("bound_commit: pending", "bound_commit: " + sha)
          if "test_run:" not in t:
              t = t.rstrip() + "\n"
              t += "test_run:\n"
              t += "  workflow: " + os.environ.get("GITHUB_WORKFLOW", "ATC Test Suite") + "\n"
              t += "  run_id: " + rid + "\n"
              t += "  commit: " + sha + "\n"
              t += "  timestamp: " + datetime.datetime.now(datetime.timezone.utc).isoformat() + "\n"
              t += "  result: PASS\n"
              t += "  runner: github-actions\n"
              open(p, "w", encoding="utf-8").write(t)
          PY
          git config user.name "Aurora-Bot"
          git config user.email "aurora@base44.ai"
          git add .atc/evidence/evidence.yaml
          git commit -m "chore(evidence): bound_commit auto + test_run PASS (SCR-0081) [skip ci]" || echo "nichts zu committen"
          git push || echo "EVIDENCE_PUSH_BLOCKED"
