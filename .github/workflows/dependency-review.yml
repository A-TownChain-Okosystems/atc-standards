name: ATC Dependency Security Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build dependency graph
        run: python3 tools/dependency_guard.py graph --out artifacts/dependency
      - name: Native dependency review
        run: python3 tools/dependency_guard.py review --out artifacts/dependency
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atc-dependency-evidence-${{ github.sha }}
          path: artifacts/dependency/
          if-no-files-found: error
