# ATC Code Quality Gate — ATC-STD-081 (Coding) / ATC-STD-082 (Code Style), SCR-0123 Welle 2
# Profil SSOT: ruff.toml (E,W,F,I; E501 ausstehend Welle 3) | ruff gepinnt 0.16.7
name: ATC Code Quality (STD-081/082)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Python-Syntax P0 (alle Python-Quellen)
        run: python -m compileall -q .
      - name: Projekt-Abhaengigkeiten installieren
        run: pip install -r requirements.txt
      - name: Generator-Reproduzierbarkeit (ATC-STD-PROTOCOL-001)
        run: |
          python tools/protocol/gen_protocol_registry.py
          git diff --exit-code -- registry/protocol-registry.yaml
      - name: Ruff installieren (gepinnt, ATC-STD-CI-001 CI-004)
        run: pip install ruff==0.16.7
      - name: Lint-Pruefung (ATC-STD-081)
        run: ruff check .
      - name: Format-Pruefung (ATC-STD-082)
        run: ruff format --check .
