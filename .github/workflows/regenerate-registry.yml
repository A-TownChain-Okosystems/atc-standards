name: Regenerate Protocol Registry

on:
  push:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Regenerate registry
        run: python tools/protocol/gen_protocol_registry.py
      - name: Commit generated registry
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- registry/protocol-registry.yaml; then
            echo "Registry already matches generator output."
            exit 0
          fi
          git config user.name "ShivaCoreDev"
          git config user.email "michael.worob@gmail.com"
          git add registry/protocol-registry.yaml
          git commit -m "ci: regenerate protocol registry after generator format"
          git push
