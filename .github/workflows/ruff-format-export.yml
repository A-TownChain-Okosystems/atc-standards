name: Ruff Format Patch Export

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check --no-input ruff==0.16.7
      - name: Format measured hotspots
        run: |
          ruff format \
            tools/dependency_guard.py \
            tests/test_dependency_guard.py \
            tools/dependency_sbom.py \
            tools/osv_fetch.py \
            tools/osv_snapshot.py \
            tools/protocol/gen_protocol_registry.py \
            tools/gen_views/generate_views.py
      - name: Export patch
        run: git diff -- tools/dependency_guard.py tests/test_dependency_guard.py tools/dependency_sbom.py tools/osv_fetch.py tools/osv_snapshot.py tools/protocol/gen_protocol_registry.py tools/gen_views/generate_views.py > ruff-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-format-patch
          path: ruff-format.patch
          if-no-files-found: error
