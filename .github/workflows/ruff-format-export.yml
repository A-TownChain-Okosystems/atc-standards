name: Ruff Format Patch Export

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Skip formatting commit
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci: apply Ruff formatting')
        run: echo "Formatting commit already applied; nothing to do."

      - name: Checkout
        if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'ci: apply Ruff formatting')"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'ci: apply Ruff formatting')"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Ruff
        if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'ci: apply Ruff formatting')"
        run: python -m pip install --disable-pip-version-check --no-input ruff==0.16.7

      - name: Format measured hotspots
        if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'ci: apply Ruff formatting')"
        run: |
          ruff format \
            tools/dependency_guard.py \
            tests/test_dependency_guard.py \
            tools/dependency_sbom.py \
            tools/osv_fetch.py \
            tools/osv_snapshot.py \
            tools/protocol/gen_protocol_registry.py \
            tools/gen_views/generate_views.py

      - name: Commit formatted files
        if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'ci: apply Ruff formatting')"
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --             tools/dependency_guard.py             tests/test_dependency_guard.py             tools/dependency_sbom.py             tools/osv_fetch.py             tools/osv_snapshot.py             tools/protocol/gen_protocol_registry.py             tools/gen_views/generate_views.py; then
            echo "Ruff format produced no changes."
            exit 0
          fi
          git config user.name "ShivaCoreDev"
          git config user.email "michael.worob@gmail.com"
          git add             tools/dependency_guard.py             tests/test_dependency_guard.py             tools/dependency_sbom.py             tools/osv_fetch.py             tools/osv_snapshot.py             tools/protocol/gen_protocol_registry.py             tools/gen_views/generate_views.py
          git commit -m "ci: apply Ruff formatting to measured hotspots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
