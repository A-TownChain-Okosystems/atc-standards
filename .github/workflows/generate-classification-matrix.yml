name: Generate Classification Matrix

on:
  push:
    branches:
      - feat/standard-registry-migration-foundation
    paths:
      - registry/standards.yaml
      - tools/registry-migration/classification_matrix.py
      - .github/workflows/generate-classification-matrix.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install YAML dependency
        run: python -m pip install pyyaml

      - name: Generate classification matrix
        run: python tools/registry-migration/classification_matrix.py

      - name: Commit generated matrix
        run: |
          if git diff --quiet -- registry/migrations/classification-matrix.generated.yaml; then
            echo "Classification matrix is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/migrations/classification-matrix.generated.yaml
          git commit -m "chore(migration): generate complete classification matrix"
          git push
