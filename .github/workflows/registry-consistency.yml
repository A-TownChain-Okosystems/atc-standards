name: Registry Consistency

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  registry-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for migration inventory
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser for migration inventory
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Generate legacy migration inventory
        run: |
          python tools/registry-migration/inventory.py \
            --repo . \
            --output registry/migrations/standard-inventory.generated.yaml

      - name: Validate migration inventory invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          p = Path('registry/migrations/standard-inventory.generated.yaml')
          data = yaml.safe_load(p.read_text(encoding='utf-8'))
          assert data['rules']['canonical_ids_allocated_only_after_review'] is True
          assert data['rules']['automatic_family_assignment'] is False
          assert all(e['canonical_id'] is None for e in data['entries'])
          assert all(e['sequence'] is None for e in data['entries'])
          assert all(e['family']['id'] is None for e in data['entries'])
          assert all(e['category']['id'] is None for e in data['entries'])
          assert all(e['class']['id'] is None for e in data['entries'])
          print(f"Validated {len(data['entries'])} legacy inventory entries")
          print(f"Registry SHA-256: {data['discovery']['registry_sha256']}")
          print(f"Duplicate IDs: {len(data['discovery']['duplicate_legacy_ids'])}")
          PY

      - name: Persist generated legacy inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/migrations/standard-inventory.generated.yaml
          if git diff --cached --quiet; then
            echo 'Generated inventory unchanged.'
          else
            git commit -m 'chore(migration): persist generated legacy inventory [skip ci]'
            git push origin HEAD:feat/standard-registry-migration-foundation
          fi

      - name: Upload migration inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: standard-inventory-generated
          path: registry/migrations/standard-inventory.generated.yaml
          if-no-files-found: error

      - name: Validate registry-generated views
        run: python3 tools/consistency/registry_view_gate.py

      - name: Reject stale governance snapshots
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'ATC-STD-000[^[:alnum:]]+v1\.2\.0[^[:alnum:]]+|v1\.2\.0[^[:alnum:]]+(APPROVED|STABLE|CANDIDATE)' \
            README.md STATUS.md AGENT_MANIFEST.md tools/gen_views 2>/dev/null; then
            echo 'FAIL: stale ATC-STD-000 v1.2.0 governance snapshot detected.'
            exit 1
          fi
          if grep -RInE '[0-9]+ (standards|repositories|repos)' README.md STATUS.md AGENT_MANIFEST.md tools/gen_views 2>/dev/null \
             | grep -vE 'generated|GENERATED|historical|History|registry'; then
            echo 'FAIL: unqualified hard-coded registry/repository count detected in generated/governance views.'
            exit 1
          fi
