name: Registry Consistency

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  registry-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for migration inventory
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser for migration inventory
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Generate legacy migration inventory
        run: |
          python tools/registry-migration/inventory.py \
            --repo . \
            --output registry/migrations/standard-inventory.generated.yaml

      - name: Generate semantic classification backlog
        run: |
          python tools/registry-migration/classification_backlog.py \
            --inventory registry/migrations/standard-inventory.generated.yaml \
            --output registry/migrations/classification-backlog.yaml

      - name: Generate Phase-2B classification matrix
        run: |
          python tools/registry-migration/classification_matrix.py \
            --repo . \
            --output registry/migrations/classification-matrix.generated.yaml

      - name: Validate Phase-2B classification matrix
        run: |
          python tools/registry-migration/classification_matrix_validator.py \
            --registry registry/standards.yaml \
            --matrix registry/migrations/classification-matrix.generated.yaml

      - name: Validate migration invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          inventory = yaml.safe_load(Path('registry/migrations/standard-inventory.generated.yaml').read_text(encoding='utf-8'))
          backlog = yaml.safe_load(Path('registry/migrations/classification-backlog.yaml').read_text(encoding='utf-8'))
          matrix = yaml.safe_load(Path('registry/migrations/classification-matrix.generated.yaml').read_text(encoding='utf-8'))
          assert inventory['rules']['canonical_ids_allocated_only_after_review'] is True
          assert inventory['rules']['automatic_family_assignment'] is False
          assert all(e['canonical_id'] is None for e in inventory['entries'])
          assert all(e['sequence'] is None for e in inventory['entries'])
          assert all(e['family']['id'] is None for e in inventory['entries'])
          assert all(e['category']['id'] is None for e in inventory['entries'])
          assert all(e['class']['id'] is None for e in inventory['entries'])
          assert backlog['rules']['canonical_ids_allocated'] is False
          assert backlog['rules']['family_assignments_allocated'] is False
          assert len(backlog['entries']) == len(inventory['entries'])
          assert all(e['classification']['canonical_id'] is None for e in backlog['entries'])
          assert matrix['summary']['canonical_ids'] == 0
          assert all(e['migration']['canonical_id'] is None for e in matrix['entries'])
          assert all(e['migration']['family_id'] is None for e in matrix['entries'])
          assert all(e['migration']['category_id'] is None for e in matrix['entries'])
          assert all(e['migration']['class_id'] is None for e in matrix['entries'])
          assert all(e['migration']['sequence'] is None for e in matrix['entries'])
          print(f"Inventory entries: {len(inventory['entries'])}")
          print(f"Registry SHA-256: {inventory['discovery']['registry_sha256']}")
          print(f"Duplicate IDs: {len(inventory['discovery']['duplicate_legacy_ids'])}")
          print(f"Classification status counts: {backlog['summary']['status_counts']}")
          print(f"Classification matrix entries: {len(matrix['entries'])}")
          PY

      - name: Persist generated migration baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/migrations/standard-inventory.generated.yaml registry/migrations/classification-backlog.yaml registry/migrations/classification-matrix.generated.yaml
          if git diff --cached --quiet; then
            echo 'Generated migration baseline unchanged.'
          else
            git commit -m 'chore(migration): persist inventory and classification baseline [skip ci]'
            git push origin HEAD:feat/standard-registry-migration-foundation
          fi

      - name: Upload migration inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: standard-inventory-generated
          path: registry/migrations/standard-inventory.generated.yaml
          if-no-files-found: error

      - name: Upload classification backlog artifact
        uses: actions/upload-artifact@v4
        with:
          name: classification-backlog-generated
          path: registry/migrations/classification-backlog.yaml
          if-no-files-found: error

      - name: Upload classification matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: classification-matrix-generated
          path: registry/migrations/classification-matrix.generated.yaml
          if-no-files-found: error

      - name: Validate registry-generated views
        run: python3 tools/consistency/registry_view_gate.py

      - name: Reject stale governance snapshots
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'ATC-STD-000[^[:alnum:]]+v1\.2\.0[^[:alnum:]]+|v1\.2\.0[^[:alnum:]]+(APPROVED|STABLE|CANDIDATE)' \
            README.md STATUS.md AGENT_MANIFEST.md tools/gen_views 2>/dev/null; then
            echo 'FAIL: stale ATC-STD-000 v1.2.0 governance snapshot detected.'
            exit 1
          fi
          if grep -RInE '[0-9]+ (standards|repositories|repos)' README.md STATUS.md AGENT_MANIFEST.md tools/gen_views 2>/dev/null \
             | grep -vE 'generated|GENERATED|historical|History|registry'; then
            echo 'FAIL: unqualified hard-coded registry/repository count detected in generated/governance views.'
            exit 1
          fi
