name: KAI-OS Build Schema Validation

on:
  pull_request:
    paths:
      - "change-requests/SCR-0145.md"
      - "schemas/kai-os-unified-build/**"
      - "tools/validate_kai_os_build_schemas.py"
      - ".github/workflows/kai-os-build-schemas.yml"
  push:
    branches: [main]
    paths:
      - "change-requests/SCR-0145.md"
      - "schemas/kai-os-unified-build/**"
      - "tools/validate_kai_os_build_schemas.py"
      - ".github/workflows/kai-os-build-schemas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate SCR-0145 JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate schemas and six-target contract
        run: python tools/validate_kai_os_build_schemas.py
