schema_version: "1.0.0"
status: open
purpose: "Fail-closed conflict register for legacy registry and taxonomy migration"
rules:
  canonical_ids_allocated: false
  legacy_ids_modified: false
  conflicts_block_migration: true
  numeric_range_implies_family: false
  generated_state_drift_requires_resolution: true
conflicts:
  - id: MIG-CONFLICT-001
    type: taxonomy-model
    status: open
    severity: high
    scope: registry/standards.yaml
    description: "The registry contains multiple identifier namespaces: numeric ATC-STD-NNN, domain-prefixed ATC-STD-*, and additional ATC-AAS/ATC-ENT/ATC-ARCH namespaces."
    evidence:
      observed_record_count: 505
      namespace_counts:
        ATC-STD-numeric: 304
        ATC-STD-domain-prefixed: 145
        ATC-AAS: 25
        ATC-ENT: 15
        ATC-ARCH: 1
        ATC: 15
    resolution: "Inventory all namespaces before canonical Family-scoped allocation."

  - id: MIG-CONFLICT-002
    type: semantic-range-collision
    status: open
    severity: critical
    scope: "ATC-STD-600..699"
    description: "The legacy 600-range is semantically partitioned across OS, language/development, audit/evidence, repository/supply-chain, and governance standards. It cannot be interpreted as a Blockchain Family."
    evidence:
      observed_entries: 31
      categories:
        os: 8
        development: 6
        audit: 4
        repository: 6
        governance: 7
      examples:
        - "ATC-STD-600..607 are OS standards."
        - "ATC-STD-620, 623..627 are ATCLang/development standards."
        - "ATC-STD-640, 641, 643, 646 are audit standards."
        - "ATC-STD-660, 662, 664..667 are repository/supply-chain standards."
        - "ATC-STD-680..686 are governance standards."
    resolution: "Perform semantic classification per legacy standard; never bulk-map 600..699 to F03."

  - id: MIG-CONFLICT-003
    type: generated-state-drift
    status: resolved
    severity: critical
    scope: "registry/standards.yaml vs generated registry anchors"
    description: "The previous audit incorrectly compared two different hash types. registry/GENERATED_STATE.md stores the Git blob SHA of registry/standards.yaml, while registry/registry.lock stores a SHA-256 digest of the file bytes. The current Git blob SHA is consistent with GENERATED_STATE.md. The registry.lock SHA-256 was stale and has now been refreshed from the observed repository bytes."
    evidence:
      observed_registry_sha256: "f5171f46250c6ad0e7a08b906a1657225413dbc1929e57d78cc38a138c80fcde"
      registry_lock_sha256_previous: "8ff9ce3b9aba170adbeb0833ad1b7f0ada86f671c036ba152b4aebd7f1f87cf27"
      registry_lock_sha256_current: "f5171f46250c6ad0e7a08b906a1657225413dbc1929e57d78cc38a138c80fcde"
      generated_state_git_blob_sha: "2c1ae2355ee1bb5110898a3bb8839ae713e85203"
      current_registry_git_blob_sha: "2c1ae2355ee1bb5110898a3bb8839ae713e85203"
      duplicate_legacy_ids: 0
    resolution: "Keep hash semantics explicit: Git blob SHA for GENERATED_STATE.md gate; SHA-256 file digest for registry.lock. Recompute both from the authoritative registry whenever registry/standards.yaml changes."

  - id: MIG-CONFLICT-004
    type: legacy-structure
    status: open
    severity: high
    scope: registry/categories.yaml
    description: "The existing category registry still models the former numeric 000..900 family/range scheme."
    resolution: "Treat the existing structure as legacy input; do not reinterpret it as the new Fxx/Cxx/CLxx hierarchy until the successor governance standards are approved."

  - id: MIG-CONFLICT-005
    type: legacy-family-structure
    status: open
    severity: medium
    scope: registry/families
    description: "Existing FAM-* family artifacts coexist with the proposed F01/F02/F03 family namespace."
    resolution: "Inventory and explicitly map legacy FAM-* records; no implicit equivalence with canonical Fxx IDs."

  - id: MIG-CONFLICT-006
    type: canonical-allocation
    status: open
    severity: critical
    scope: registry/migrations/standard-inventory.yaml
    description: "Canonical IDs cannot be allocated until semantic Family/Category/Class classification has been reviewed."
    resolution: "Keep canonical_id and sequence null for unreviewed records; allocate only through governed registry changes."
