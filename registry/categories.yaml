agent-operating: {name: agent-operating,  range: "ATC-STD-AOS-001-999", description: "Agent-Operating-Familie: Verbindliches 14-Fragen-Session-Mandat fuer alle KI-Agenten, Session-Records, Audit-Nachweis (Owner-Entwurf 07.09., SCR-0022)"}

master-audit: {name: master-audit,  range: "ATC-STD-999", description: "Master-Audit-Familie: Enterprise Completeness & Consistency Audit — 16-Stufen-Kette, 13 Change-Nachweis-Fragen, MAUD-Records, Orchestrierung (Owner-Entwurf 07.09., SCR-0022)"}

